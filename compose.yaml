services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-payments}
      MYSQL_USER: ${MYSQL_USER:-payments}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-payments}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
    ports:
      - "3306:3306"
    volumes:
      - payments_mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -p\"$${MYSQL_ROOT_PASSWORD}\""]
      interval: 5s
      timeout: 3s
      retries: 20
    networks:
      - app-network

  api:
    build: ./backend
    environment:
      DB_URL: jdbc:mysql://mysql:3306/${MYSQL_DATABASE:-payments}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      DB_USERNAME: ${MYSQL_USER:-payments}
      DB_PASSWORD: ${MYSQL_PASSWORD:-payments}
      EXCHANGE_RATE_API_KEY: ${EXCHANGE_RATE_API_KEY:-}
      APP_ENVIRONMENT: ${APP_ENVIRONMENT:-development}
      ANALYTICS_TIME_ZONE: ${ANALYTICS_TIME_ZONE:-Asia/Kolkata}
      ANALYTICS_BASE_CURRENCY: ${ANALYTICS_BASE_CURRENCY:-USD}
      ANALYTICS_MAX_QUERY_ROWS: ${ANALYTICS_MAX_QUERY_ROWS:-250000}
    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://localhost:8080/actuator/health"]
      interval: 10s
      timeout: 3s
      retries: 10
    networks:
      - app-network

  web:
    build:
      context: ./frontend
      args:
        VITE_API_URL: ${VITE_API_URL:-/api/v1}
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1/"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - app-network

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "${NGINX_PORT:-8081}:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - api
      - web
    restart: unless-stopped
    networks:
      - app-network

networks:
  app-network:
    driver: bridge

volumes:
  payments_mysql:
